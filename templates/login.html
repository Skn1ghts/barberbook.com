<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BarberBook | Admin Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="navbar">
        <a class="logo" href="/">
            <img src="{{ url_for('static', filename='barberbook_logo.svg') }}" alt="BarberBook Logo" class="logo-img" width="48" height="32">
            BarberBook<span>.</span>
        </a>
    </header>

    <main class="booking-section" style="margin-top: 50px; max-width: 500px;">
        <div class="section-heading">
            <p class="eyebrow">RESTRICTED ACCESS</p>
            <h2>Admin Login</h2>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="message {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="POST" class="booking-form" style="grid-template-columns: 1fr;">
            <div class="field">
                <label for="username">Username</label>
                <input id="username" name="username" type="text" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" required>
            </div>
            <button class="primary-button" type="submit" style="width: 100%;">Log In</button>
        </form>
    </main>
</body>
</html>
